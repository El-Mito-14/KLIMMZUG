<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Klimmzug-Training</title>
<style>
:root{--bg:#fff;--ink:#2e2e30;--mut:#6b6b70;--red:#d32f2f;--line:#e4e4e7;--g:#2e9e4f;--o:#f29a1f;color-scheme:light;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:20px 20px 12px;display:flex;flex-direction:column}
nav{display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:15px;background:none;border:0;border-top:3px solid transparent;font-size:16px;font-weight:600;color:var(--mut)}
nav button.on{color:var(--red);border-top-color:var(--red)}
h1{font-size:26px;margin:0 0 16px}h2{font-size:18px;margin:18px 0 8px}
label{display:block;font-size:14px;color:var(--mut);margin-bottom:14px}
input{display:block;width:100%;margin-top:6px;padding:13px;font-size:18px;border:1.5px solid var(--line);border-radius:10px;color:var(--ink);background:var(--bg)}
input:focus{outline:none;border-color:var(--red)}
.btn{width:100%;padding:16px;border:0;border-radius:12px;background:var(--red);color:#fff;font-size:18px;font-weight:700;margin-top:12px}
.btn.alt{background:var(--ink);color:var(--bg)}.btn.ghost{background:none;color:var(--mut);font-size:15px;font-weight:600}
.sub{text-align:center;color:var(--mut);font-size:15px}.big{text-align:center;font-size:24px;font-weight:700;margin:6px 0}
.rw{cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative;width:min(72vw,270px);margin:12px auto}.rw svg{width:100%;display:block}
.bgc{fill:none;stroke:var(--line);stroke-width:14}.fg{fill:none;stroke:var(--red);stroke-width:14;stroke-dasharray:754 754}
.tm{color:var(--red);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:700;font-variant-numeric:tabular-nums}
.rate{margin-top:auto;padding-top:14px}.rate p{margin:0 0 8px;font-size:14px;color:var(--mut);text-align:center}
.cells{display:flex;gap:4px}.cells button,.c{flex:1;height:38px;border-radius:7px;border:1.5px solid var(--line);background:var(--bg);font-size:14px;font-weight:600;color:var(--ink);padding:0}
.c{display:flex;align-items:center;justify-content:center;height:26px;font-size:12px}
.g{background:var(--g)!important;border-color:var(--g)!important;color:#fff!important}.o{background:var(--o)!important;border-color:var(--o)!important;color:#fff!important}.r{background:#d32f2f!important;border-color:#d32f2f!important;color:#fff!important}
.row{display:flex;align-items:center;gap:8px;margin-bottom:8px}.row b{width:150px;font-size:14px;flex:none}
ol{padding-left:22px}ol li{padding:9px 0;border-bottom:1px solid var(--line);font-size:17px}
.card{border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.kc{font-size:34px;font-weight:800;color:var(--red)}.mut{color:var(--mut);font-size:13px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal .h{font-size:12px;color:var(--mut);padding:4px 0}
.d{aspect-ratio:1;border:0;background:none;border-radius:10px;font-size:15px;color:var(--ink);position:relative;padding:0}
.d.t:after{content:"";position:absolute;left:50%;bottom:6px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--red)}
.d.s{background:var(--ink);color:var(--bg)}.d.n{outline:1.5px solid var(--red)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.mh button{border:0;background:none;font-size:28px;color:var(--red);padding:4px 14px}
[data-theme=dark]{--bg:#2e2e30;--ink:#fff;--line:#4a4a4e;--mut:#a3a3a8}
.hint{font-size:34px;color:var(--red);animation:up 1.2s ease-in-out infinite}@keyframes up{50%{transform:translateY(-10px)}}
.hw{position:relative;width:min(64vw,250px);aspect-ratio:1;margin:14px auto;touch-action:none}
.hg{position:absolute;inset:0;border-radius:50%;background:conic-gradient(hsl(0,70%,48%),hsl(60,70%,48%),hsl(120,70%,48%),hsl(180,70%,48%),hsl(240,70%,48%),hsl(300,70%,48%),hsl(360,70%,48%));-webkit-mask:radial-gradient(circle,transparent 58%,#000 59%);mask:radial-gradient(circle,transparent 58%,#000 59%)}
#hm{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px #0007;background:var(--red);pointer-events:none}
.hc{position:absolute;inset:22%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:none}
.pr{width:54px;height:54px;border-radius:50%;border:7px solid var(--red)}.pl{background:var(--red);color:#fff;font-weight:700;font-size:14px;padding:8px 18px;border-radius:20px}
.gp{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 4px;font-size:17px;color:var(--ink)}
.gp.x{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:3px;color:var(--mut)}
.hero{background:var(--red);color:#fff;border-radius:18px;padding:18px;text-align:center;margin-bottom:12px}.hero div:first-child,.hero div:last-child{opacity:.85;font-size:13px}.hk{font-size:46px;font-weight:800;line-height:1.1}.hk small{font-size:18px;font-weight:600}
.sts{display:flex;gap:8px;margin-bottom:6px}.st{flex:1;border:1.5px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}.st b{display:block;font-size:19px}.st span{font-size:12px;color:var(--mut)}
.sec{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:700;margin:20px 0 8px}
.sc{border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}.sh{display:flex;align-items:center;gap:10px;margin-bottom:8px}.nb{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.kr{display:flex;justify-content:space-between;font-size:14px;margin-top:6px}.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--red)}
#gear,#home,#vol{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);right:10px;z-index:5;width:42px;height:42px;border:0;background:none;font-size:26px;color:var(--ink);padding:0}
#gear,#home,#vol{display:flex;align-items:center;justify-content:center}
#home{right:98px}
html,body{overscroll-behavior:none}main{overscroll-behavior:contain}
main h1{padding-right:140px}
#dlg{position:fixed;inset:0;z-index:20;background:#0009;display:flex;align-items:center;justify-content:center;padding:24px}
.dg{background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:20px;padding:22px;width:100%;max-width:360px}
.dg h2{margin:0 0 8px;font-size:20px}.dg p{margin:0 0 18px;color:var(--mut);font-size:15px;line-height:1.45}
.dgb{display:flex;gap:10px}.dgb .btn{margin:0;padding:14px 8px;font-size:15px}
.ah{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;padding:16px 2px;font-size:18px;font-weight:700;color:var(--ink)}.ah span+span{display:inline-block;transition:transform .2s;color:var(--red);font-size:24px}
.lr{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 4px;font-size:17px;color:var(--ink)}.lr.on{color:var(--red);font-weight:700}
.fl{width:30px;height:20px;border-radius:4px;overflow:hidden;flex:none;border:1px solid var(--line)}.fl svg{display:block;width:100%;height:100%}
.pl{border:0;pointer-events:auto;font-family:inherit;font-size:15px;padding:10px 22px}
.hc .pl{width:100%;padding:20px 0;font-size:22px;border-radius:30px}
nav button{padding:15px 2px;font-size:14px}
.d.p:not(.t):after{content:"";position:absolute;left:50%;bottom:6px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;border:1.5px solid var(--red);box-sizing:border-box}
.pb{display:block;width:100%;background:none;border:1.5px solid var(--line);border-radius:12px;padding:13px 4px;font-size:16px;color:var(--ink);margin-bottom:6px}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg .pb{flex:1;margin:0;font-size:14px}
.pb.pk{border:2px solid var(--red);padding:12.5px 3.5px;font-weight:700}
.d.pk{box-shadow:inset 0 0 0 2px var(--red);font-weight:700}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}.wk .pb{aspect-ratio:1;margin:0;padding:0;font-size:15px;display:flex;align-items:center;justify-content:center}
#mc{touch-action:pan-y}.d:disabled{opacity:.45}
#vol{right:54px}
#vp{position:fixed;top:calc(env(safe-area-inset-top,0px) + 54px);right:20px;width:210px;padding:14px 16px;display:none;align-items:center;z-index:6;background:var(--bg);border:1.5px solid var(--line);border-radius:16px;box-shadow:0 8px 24px #0003}
#vs{-webkit-appearance:none;appearance:none;width:100%;height:10px;margin:0;padding:0;border:0;border-radius:6px;background:linear-gradient(to right,var(--red) var(--v,100%),var(--line) var(--v,100%));outline:none}
#vs::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--red);border:3px solid var(--bg);box-shadow:0 0 0 1.5px var(--red)}
label.fr{display:flex;align-items:center;gap:12px;font-size:15px;color:var(--ink);margin-bottom:18px}
.fi{display:flex;align-items:center;gap:12px;flex:1;min-width:0}.fi svg{width:32px;height:32px;flex:none;color:var(--red)}
.fr input{width:96px;flex:none;margin:0;text-align:center;font-size:18px}
.np{cursor:pointer}input.np.act{border-color:var(--red)}
#kp{position:fixed;inset:0;z-index:30;display:none}#kp .kb{position:absolute;inset:0;background:#0006}
.ks{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-top:1.5px solid var(--line);border-radius:22px 22px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.kd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;padding:0 4px}.kd span{color:var(--mut);font-size:14px}.kd b{font-size:30px;color:var(--red)}
.kg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kg button{height:56px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font-size:24px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0}.kg button:active{background:var(--red);border-color:var(--red);color:#fff}
body.kp main{padding-bottom:390px}
.iw{position:relative;flex:none;width:118px}.iw input{width:100%;padding-right:46px;text-align:right}
.iw em{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--mut);font-size:15px;pointer-events:none}
</style><link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
</head><body>
<button id="vol" onclick="tv()" aria-label="Lautstärke"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path id="w1" d="M16 9a4 4 0 0 1 0 6"/><path id="w2" d="M18.5 6.5a8 8 0 0 1 0 11"/><path id="wx" d="M16 9l5 6M21 9l-5 6"/></svg></button><div id="vp"><input id="vs" type="range" min="0" max="100"></div>
<button id="home" onclick="home()" aria-label="Startbildschirm"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"/></svg></button>
<button id="gear" onclick="go('set')" aria-label="Einstellungen"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" stroke-width="3" stroke-dasharray="3.5 3.5"/><circle cx="12" cy="12" r="6.3"/><circle cx="12" cy="12" r="2.3"/></svg></button>
<main id="m"></main>
<nav><button id="n1" onclick="go('train')">Training</button><button id="n2" onclick="go('cal')">Kalender</button><button id="n3" onclick="go('ana')">Analyse</button><button id="n4" onclick="go('game')">Minigame</button></nav>
<script>
const GRIPS=["","Standard","Handtuch (eng)","Parallel","Handtuch (breit)","Bizeps","Diagonal (Standard)","Diagonal (Bizeps)"];
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const $=s=>document.querySelector(s);
let tab='train',S={phase:'splash'},ed=null,timer=null,ac=null,wl=null,sel=null;
let cfg=ls.get('kt_cfg',{w:'',x:'',rope:3,set:4});
const now=new Date();let cal={y:now.getFullYear(),m:now.getMonth()};
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let prev='train';function go(t){if(t==='set'&&tab!=='set'){prev=tab;sopen='';pmv=null}tab=t;render()}
function beep(q){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.3*ui.vol,ac.currentTime);o.start();o.stop(ac.currentTime+.5)}catch(e){}if(!q)try{navigator.vibrate&&navigator.vibrate([250,120,250])}catch(e){}}
function tick(){const rem=Math.max(0,S.paused?S.remain:S.end-Date.now()),f=rem/S.dur,r=$('#ring'),t=$('#time');
 if(r)r.style.strokeDasharray=(f*753.98).toFixed(1)+' 754';
 if(t){if(S.paused){t.innerHTML=PAUSE;return rem}const s=Math.ceil(rem/1000);t.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}return rem}
function runTick(){clearInterval(timer);timer=setInterval(()=>{if(tick()<=0){clearInterval(timer);beep();S.onEnd()}},100)}
function startTimer(min,onEnd){S.paused=false;S.dur=min*60000;S.end=Date.now()+S.dur;S.onEnd=onEnd;runTick();tick()}
function tp(){if(!S.end||!S.onEnd)return;if(S.paused){S.paused=false;S.end=Date.now()+S.remain;runTick()}else{clearInterval(timer);S.remain=Math.max(0,S.end-Date.now());S.paused=true}tick()}
function skip(){clearInterval(timer);S.onEnd()}
function ring(){return '<div class="rw" onclick="tp()"><svg viewBox="0 0 280 280"><circle class="bgc" cx="140" cy="140" r="120"/><circle id="ring" class="fg" cx="140" cy="140" r="120" transform="rotate(-90 140 140)"/></svg><div id="time" class="tm">0:00</div></div>'}
function start(){
 const w=parseFloat($('#w').value.replace(',','.'));
 if(!(w>0)){$('#msg').textContent=tx('Bitte Körpergewicht eingeben.');return}
 const num=(id,d)=>{const v=parseFloat($(id).value.replace(',','.'));return v>0?v:d};
 const x=parseFloat($('#x').value.replace(',','.'))||0;
 cfg={w,x,rope:(()=>{const v=parseFloat($('#rope').value.replace(',','.'));return isNaN(v)||v<0?3:v})(),set:num('#set',4)};ls.set('kt_cfg',cfg);
 try{ac=ac||new AudioContext()}catch(e){}
 try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>wl=l).catch(()=>{})}catch(e){}
 S={phase:'warm',cfg,order:null,i:0,R:[],push:0};
 if(cfg.rope>0)startTimer(cfg.rope,()=>{S.phase='order';render()});else S.phase='order';render()}
function cancel(){clearInterval(timer);try{wl&&wl.release()}catch(e){}S={phase:'setup'};render()}
function gen(){const a=[1,2,3,4,5,6,7].filter(k=>!off.includes(k));if(!a.length)return;for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}S.order=a;render()}
function runSet(){S.phase='set';startTimer(S.cfg.set,()=>{if(S.i<S.order.length-1){S.i++;runSet()}else{S.phase='push';render()}});render()}
function getR(i){return S.R[i]||(S.R[i]={cells:Array(10).fill(null),c:0,p:0,done:false})}
function rate(i,n){const r=getR(i);if(n<=r.p)return;r.c++;const col=['g','o','r'][r.c-1];
 for(let k=r.p;k<n;k++)r.cells[k]=col;r.p=n;
 if(n===10||r.c===3){for(let k=r.p;k<10;k++)r.cells[k]='r';r.done=true}render()}
function rbar(i){const r=getR(i);if(r.done)return'';
 const hint=['sauber geschafft','gerade so geschafft','nicht geschafft'][r.c];
 let h='<div class="rate"><p>Satz '+(i+1)+' - '+hint+'</p><div class="cells">';
 for(let n=1;n<=10;n++)h+='<button class="'+(r.cells[n-1]||'')+'" onclick="rate('+i+','+n+')">'+n+'</button>';
 return h+'</div></div>'}
function finishPush(){S.push=parseInt($('#pr').value)||0;if(S.cfg.rope>0){S.phase='cool';startTimer(S.cfg.rope,finish);render()}else finish()}
function reps(cells){return cells.filter(c=>c==='g'||c==='o').length}
function calc(s){s.pull=s.ratings.reduce((a,r)=>a+reps(r),0);s.kRope=Math.round(11*s.w*(2*s.rope/60));s.kPull=Math.round(s.pull*(s.w+s.x)*0.00469);s.kPush=Math.round(s.push*(0.64*s.w+s.x)*0.003752);s.kcal=s.kRope+s.kPull+s.kPush}
function finish(){clearInterval(timer);try{wl&&wl.release()}catch(e){}
 const c=S.cfg,ses={id:Date.now(),date:key(new Date()),w:c.w,x:c.x,rope:c.rope,order:S.order,ratings:S.order.map((g,i)=>getR(i).cells),push:S.push};calc(ses);
 const all=ls.get('kt_sessions',[]);all.push(ses);ls.set('kt_sessions',all);S={phase:'done',ses};render()}
function summary(s){const d=s.date.split('-').reverse().join('.'),tot=s.kcal||1,pc=v=>Math.round(v/tot*100),t=(v,l)=>'<div class="st"><b>'+v+'</b><span>'+l+'</span></div>';
 let h='<div class="hero"><div>'+d+'</div><div class="hk">'+s.kcal+'<small> kcal</small></div><div>geschätzter Verbrauch</div></div>';
 h+='<div class="sts">'+t(s.pull,'Klimmzüge')+t(s.push,'Liegestütze')+t(s.w+(s.x?' +'+s.x:'')+' kg','Gewicht')+'</div><div class="sec">Klimmzug-Sätze</div>';
 s.order.forEach((g,i)=>{const c=s.ratings[i];h+='<div class="sc"><div class="sh"><span class="nb">'+(i+1)+'</span><b>'+GRIPS[g]+'</b><span class="mut" style="margin-left:auto">'+reps(c)+' / 10</span></div><div class="cells">'+c.map((z,k)=>'<div class="c '+(z||'')+'">'+(k+1)+'</div>').join('')+'</div></div>'});
 h+='<div class="sec">Kalorien</div><div class="sc">'+[['Seilspringen',s.kRope],['Klimmzüge',s.kPull],['Liegestütze',s.kPush]].map(a=>'<div class="kr"><span>'+a[0]+'</span><b>'+a[1]+' kcal</b></div><div class="bar"><i style="width:'+pc(a[1])+'%"></i></div>').join('')+'</div>';
 return h}
function view(){
 const p=S.phase;if(p==='splash')return splash();
 if(p==='setup')return '<h1>Training</h1>'+frow(0,'Körpergewicht','<input id="w" inputmode="decimal" value="'+cfg.w+'">','kg')+frow(1,'Zusatzgewicht','<input id="x" inputmode="decimal" value="'+cfg.x+'" placeholder="0">','kg')+frow(2,'Dauer Seilspringen','<input id="rope" inputmode="decimal" value="'+cfg.rope+'">','min')+frow(3,'Dauer pro Satz','<input id="set" inputmode="decimal" value="'+cfg.set+'">','min')+'<div id="msg" class="mut" style="color:var(--red)"></div><button class="btn" style="margin-top:auto" onclick="start()">Training starten</button>';
 if(p==='warm'||p==='cool')return '<h1>'+(p==='warm'?'Warm-up':'Abschluss')+'</h1><div class="sub">Seilspringen</div>'+ring()+'<button class="btn ghost" onclick="skip()">Überspringen</button><button class="btn ghost" onclick="cancel()">Abbrechen</button>';
 if(p==='order'){
  if(!S.order)return '<h1>Klimmzüge</h1><div class="sub">Zufällige Griff-Reihenfolge für '+(7-off.length)+' Sätze</div>'+gripPanel()+'<button class="btn alt" style="margin-top:auto" onclick="showG=!showG;render()">Griffe anpassen</button><button class="btn" onclick="gen()">Reihenfolge generieren</button>';
  return '<h1>Reihenfolge</h1><ol>'+S.order.map(g=>'<li>'+GRIPS[g]+'</li>').join('')+'</ol><button class="btn alt" onclick="gen()">Neu würfeln</button><button class="btn" style="margin-top:auto" onclick="runSet()">Training starten</button>'}
